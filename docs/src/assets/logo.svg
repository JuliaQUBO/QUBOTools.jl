    </defs>

    


    <!-- FRAME -->
    <g mask="url(#mask)">
        <rect class="blue" x="0" y="0" width="1000" height="1000" stroke="none" />
    </g>

    <rect fill="url(#pattern)" stroke="none" stroke-width="2pt" overflow="visible" x="100" y="400" width="800" height="200" />
