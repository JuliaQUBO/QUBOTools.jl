<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
    <style>
        rect{
        /* stroke: none; */
        stroke-linejoin: round;
        }

        .red{
        fill: #cb3c33;
        stroke-width: 3px;
        }

        .green{
        fill: #389826;
        stroke-width: 5px;
        }

        .blue{
        fill: #4063d8;
        stroke-width: 3px;
        }

        .violet{
        fill: #9558b2;
        stroke-width: 5px;
        }

        .strand{
            white-space: pre;
            font-family: monospace;
            font-size: 15pt;
            text-anchor: middle;
            dominant-baseline: middle;
            stroke-width: 1pt;
        }
    </style>

    <defs>
        <symbol id="S-A" viewBox="0 -50 200 100" overflow="visible">
            <path id="P-A" fill="none" stroke="none" d="M0 -42 C50 -42 150  42 200  42" />
            <path id="P-B" fill="none" stroke="none"  d="M0  42 C50  42 150 -42 200 -42" />
            <text class="strand" fill="#4063d8" stroke="#4063d8">
                <textPath startOffset="50%" href="#P-A">11010101010101010110</textPath>
            </text>
            <text class="strand" fill="#cb3c33" stroke="#cb3c33">
                <textPath startOffset="50%" href="#P-B">↓  ↑  ↑  ↓  ↓  ↑  ↑ </textPath>
            </text>
            <text class="strand" fill="#389826" stroke="#389826">
                <textPath startOffset="50%" href="#P-B"> ↓  ↑  ↑  ↑  ↑  ↓  ↑</textPath>
            </text>
            <text class="strand" fill="#9558b2" stroke="#9558b2">
                <textPath startOffset="50%" href="#P-B">  ↑  ↓  ↓  ↓  ↑  ↑  </textPath>
            </text>
        </symbol>

        <symbol id="S-B" viewBox="0 -50 200 100" overflow="visible">
            <path id="P-C" fill="none" stroke="none"  d="M0  42 C50  42 150 -42 200 -42" />
            <path id="P-D" fill="none" stroke="none" d="M0 -42 C50 -42 150  42 200  42" />
            
            <text class="strand" fill="#cb3c33" stroke="#cb3c33">
                <textPath startOffset="50%" href="#P-D">↓  ↑  ↑  ↓  ↓  ↑  ↑ </textPath>
            </text>
            <text class="strand" fill="#389826" stroke="#389826">
                <textPath startOffset="50%" href="#P-D"> ↓  ↑  ↑  ↑  ↑  ↓  ↑</textPath>
            </text>
            <text class="strand" fill="#9558b2" stroke="#9558b2">
                <textPath startOffset="50%" href="#P-D">  ↑  ↓  ↓  ↓  ↑  ↑  </textPath>
            </text>
            <text class="strand" fill="#4063d8" stroke="#4063d8">
                <textPath startOffset="50%" href="#P-C">11010101010101010110</textPath>
            </text>
        </symbol>

        <pattern id="pattern" patternUnits="userSpaceOnUse" x="100" y="0" width="400" height="100" style="overflow:visible">
            <use x="0"   href="#S-A" width="200" height="100"/>
            <use x="200" href="#S-B" width="200" height="100"/>
        </pattern>

        <mask id="mask">
            <rect x="0" y="0" width="1000" height="1000" fill="white" />
            <rect x="40" y="40" width="920" height="920" fill="black" />
            <text x="500" y="225" text-anchor="middle" dominant-baseline="central" fill="white" font-size="205pt" font-family="Helvetica" font-weight="bold">
                QUBO
            </text>
            <text x="500" y="775" text-anchor="middle" dominant-baseline="central" fill="white" font-size="205pt" font-family="Helvetica" font-weight="bold">
                Tools
            </text>
        </mask>
    </defs>

    <!-- FRAME -->
    <g mask="url(#mask)">
        <rect class="blue" x="0" y="0" width="1000" height="1000" stroke="none" />
    </g>

    <rect fill="url(#pattern)" stroke="none" stroke-width="2pt" overflow="visible" x="100" y="400" width="800" height="200" />
</svg>
