        </pattern>
        <!-- </defs> -->

        

        <mask id="mask">
            <rect x="0" y="0" width="1000" height="1000" fill="white" />
            <rect x="40" y="40" width="920" height="920" fill="black" />
            <text x="500" y="225" text-anchor="middle" dominant-baseline="central" fill="white" font-size="300" font-family="Helvetica" font-weight="bold">
                QUBO
            </text>
            <text x="500" y="775" text-anchor="middle" dominant-baseline="central" fill="white" font-size="300" font-family="Helvetica" font-weight="bold">
                Tools
            </text>
            <!-- <rect x="521.5" y="530" width="415" height="220" fill="white" /> -->
