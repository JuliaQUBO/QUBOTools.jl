                d="M200 0 C250 0 350 100 400 100" />

            <text font-family="monospace" stroke="#cb3c33" text-anchor="middle" dominant-baseline="middle">
                <textPath href="#spin-path-2">Quick brown fox jumps over the lazy dog.</textPath>
            </text>

            <path
                id="bool-path-2"
                fill="none"
